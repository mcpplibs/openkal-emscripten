[package]
name = "longjmp-probe"
version = "0.1.0"
description = "A C program that siglongjmps over two frames, carrying the ABI switch the lowering needs. Not part of the implementation's build: continuous integration builds and runs it."

# Stated, not inferred: the engine infers a program from `src/main.cpp`, and
# this one is C.
[targets.longjmp-probe]
kind = "bin"
main = "src/main.c"

[target.'cfg(os = "emscripten")'.abi]
longjmp = "wasm"
